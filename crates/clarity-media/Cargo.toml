[package]
name = "clarity-media"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
clarity-protocol = { path = "../clarity-protocol" }
gstreamer.workspace = true
gstreamer-sdp.workspace = true
gstreamer-webrtc.workspace = true
percent-encoding.workspace = true
serde_json.workspace = true
smallvec = "1.13"
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true

# The Linux desktop stack: the ScreenCast portal hands out PipeWire streams,
# and the native video overlay is a Wayland subsurface.
[target.'cfg(not(windows))'.dependencies]
ashpd.workspace = true
libc.workspace = true
wayland-client.workspace = true

# Windows enumerates displays and windows itself for the in-app source picker,
# and lists the processes playing audio (WASAPI sessions, a COM API) for the
# per-application mix; capture is Windows Graphics Capture through
# GStreamer's d3d11 plugin and process loopback through wasapi2.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }
