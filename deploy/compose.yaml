name: clarity-share

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      # `app` is private to this network and Caddy is its only ingress hop.
      TRUSTED_PROXY_HOPS: "1"
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - private

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    env_file: ../.env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    networks:
      - private

  coturn:
    image: coturn/coturn:4.14.0-r0
    restart: unless-stopped
    network_mode: host
    env_file: ../.env
    command: ["/bin/sh", "/etc/coturn/start.sh"]
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - ./coturn/start.sh:/etc/coturn/start.sh:ro
      # Mount certificate files here when TURN_TLS_CERT_PATH and TURN_TLS_KEY_PATH are set.
      # - /etc/letsencrypt:/certs:ro
    read_only: true
    tmpfs:
      - /tmp:size=8m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    # The upstream binary carries cap_net_bind_service. It cannot be executed
    # when that capability is absent from the container bounding set.
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

networks:
  private:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
