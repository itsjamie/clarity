fingerprint
use-auth-secret
stale-nonce=600
no-multicast-peers
no-loopback-peers
no-cli
no-software-attribute
mobility

# Bound resource use. Raise these only after measuring the VPS.
total-quota=200
user-quota=8
# Coturn expresses this limit in bytes per second: 10,000,000 B/s = 80 Mbps.
max-bps=10000000

log-file=stdout
simple-log
no-stdout-log=false

# Dynamic realm, shared secret, external address, relay range, and optional TLS paths are written
# to a tmpfs-backed runtime configuration by start.sh. The shared secret never enters process args.
