[workspace]
resolver = "2"
members = [
  "crates/clarity-client",
  "crates/clarity-core",
  "crates/clarity-desktop",
  "crates/clarity-identity",
  "crates/clarity-media",
  "crates/clarity-protocol",
  "crates/clarity-server",
  "crates/clarity-xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Clarity Share contributors"]
rust-version = "1.96"

[workspace.dependencies]
anyhow = "1.0"
ashpd = { version = "0.13", default-features = false, features = ["tokio", "screencast"] }
async-trait = "0.1"
axum = { version = "0.8", features = ["ws", "macros"] }
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
data-encoding = "2.6"
futures-util = "0.3"
gstreamer = "0.25"
gstreamer-sdp = "0.25"
gstreamer-webrtc = { version = "0.25", features = ["v1_18"] }
percent-encoding = "2.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
hmac = "0.12"
libc = "0.2"
http = "1.2"
mime_guess = "2.0"
rand = "0.8"
ring = "0.17"
rust-embed = { version = "8.7", features = ["mime-guess"] }
schemars = "1.0"
secrecy = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
subtle = "2.6"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "macros", "parsing", "serde"] }
tokio = { version = "1.44", features = ["full", "test-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower = { version = "0.5", features = ["util", "timeout", "limit"] }
tower-http = { version = "0.6", features = ["catch-panic", "compression-gzip", "cors", "limit", "request-id", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
ts-rs = { version = "11.0", features = ["serde-compat"] }
url = "2.5"
uuid = { version = "1.16", features = ["v4", "serde"] }
wayland-client = { version = "0.31", features = ["system"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
